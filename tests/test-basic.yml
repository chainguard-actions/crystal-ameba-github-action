name: Test basic usage - run ameba linter
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true

      - name: Assert ameba ran (success or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # ameba exits 0 if no issues found, non-zero if issues found or error
          # With no Crystal files in the workspace, ameba should succeed
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: ameba ran successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: ameba ran and found issues or encountered an error (acceptable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
