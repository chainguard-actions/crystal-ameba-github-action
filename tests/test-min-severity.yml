name: Test with min-severity input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          min-severity: error
        continue-on-error: true

      - name: Assert ameba ran with min-severity=error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With min-severity=error, only error-level issues are reported
          # The action should run without crashing
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: ameba ran successfully with min-severity=error (no error-level issues found)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: ameba ran with min-severity=error and found error-level issues"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
