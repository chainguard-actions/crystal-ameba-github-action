name: Test with custom config file
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          config: tests/fixtures/.ameba.yml
        continue-on-error: true

      - name: Assert ameba ran with custom config
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should run (not crash) when a config file is provided
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: ameba ran successfully with custom config"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: ameba ran with custom config and found issues (acceptable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
