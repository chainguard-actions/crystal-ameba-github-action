name: Test with only specific rules enabled
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          only: Lint/UselessAssign
        continue-on-error: true

      - name: Assert ameba ran with only=Lint/UselessAssign
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With only=Lint/UselessAssign, only that rule is checked
          # The action should run without crashing
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: ameba ran successfully with only=Lint/UselessAssign (no useless assignments found)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: ameba ran with only=Lint/UselessAssign and found issues"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
